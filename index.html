    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong one. Mirrors src/theme/theme.ts; keep the two in step.
      (function () {
        try {
          var stored = localStorage.getItem("rm-theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.dataset.theme = stored;
            return;
          }
          var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
          document.documentElement.dataset.theme = mq && mq.matches ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
      // Randomize the live background across the four active effects unless a
      // deliberate choice is already persisted. Mirrors DEFAULTS in
      // src/design/preview.ts; keep the two in step.
      (function () {
        var pool = ["gossip", "lattice", "halftone", "shards"];
        var pick = pool[Math.floor(Math.random() * pool.length)];
        try {
          var raw = localStorage.getItem("rm-design-preview");
          if (raw) {
            var stored = JSON.parse(raw);
            var v = stored && stored.live;
            if (v === "gossip" || v === "lattice" || v === "halftone" || v === "shards" || v === "off") {
              document.documentElement.dataset.live = v;
              return;
            }
          }
        } catch (e) { /* private mode / bad JSON — fall through to random */ }
        document.documentElement.dataset.live = pick;
      })();
    </script>
