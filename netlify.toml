[build]
  command = "npm run build"
  publish = "dist"

# Client-side routing: every unknown path must serve the app shell, or deep
# links like /backend/work/living-labs 404 on a hard refresh. Hashed assets and
# the PDFs are real files and are matched before this catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/resumes/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
